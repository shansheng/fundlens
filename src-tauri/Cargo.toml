[package]
name = "fundlens"
version = "2.1.1"
description = "FundLens — 本地自算基金持仓实时估值工具"
authors = ["FundLens Team"]
edition = "2021"

# 库名供 main.rs / 子模块以 `fundlens_lib::` 引用（Tauri 标准布局）
# ⚠️ 仅保留 staticlib+rlib，去掉 cdylib：rustc 对 cdylib 不做 LTO（需完整 C ABI 符号），
# 链接时全量展开 rlib 参数；OCR 依赖（rusto-rs→nalgebra/image 等 100+ crate）加入后
# 参数超 macOS ARG_MAX → clang "posix_spawn failed: Argument list too long"（2026-08-25）。
# 桌面端 main.rs 走 staticlib 链接进 bin，lto=true 生效、命令行短，不受影响。
[lib]
name = "fundlens_lib"
crate-type = ["staticlib", "rlib"]

# 参见 https://doc.rust-lang.org/cargo/reference/manifest.html
#
# ⚠️ 本分支（feat/kylin-v10-aarch64）将 Tauri 从 2.x 降级到 1.x：
# Tauri 2.x 在 Linux 上强制依赖 libwebkit2gtk-4.1 + glibc>=2.34（Ubuntu 22.04 构建），
# 银河麒麟 V10 SP1（基于 Ubuntu 20.04）只有 libwebkit2gtk-4.0 + glibc 2.31，无法运行。
# Tauri 1.x 使用 webkit2gtk-4.0，与麒麟系统库原生匹配。
# 主干 main 继续使用 Tauri 2.x（macOS），本分支为麒麟专用分叉，两者需分别维护。
[build-dependencies]
tauri-build = { version = "1", features = [] }

[dependencies]
tauri = { version = "1", features = ["dialog-all"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.32", features = ["bundled", "backup"] }
encoding_rs = "0.8"
reqwest = { version = "0.12", default-features = false, features = ["json", "blocking", "rustls-tls", "gzip"] }
chrono = { version = "0.4", features = ["serde"] }
thiserror = "1"
once_cell = "1"
base64 = "0.22"

# 本地 OCR：PaddleOCR (PP-OCRv4) 纯 Rust 引擎（MNN 推理，无 OpenCV 依赖）
rusto-rs = { version = "0.2.1", optional = true }

[features]
# Tauri 1 生产构建必需：tauri build 会传 --features custom-protocol，未声明则报错
# "the package 'fundlens' does not contain this feature: custom-protocol"
custom-protocol = ["tauri/custom-protocol"]

# OCR（PaddleOCR / PP-OCRv4 纯 Rust 引擎 rusto-rs）默认开启：截图导入始终可用，
# 不再需要手动传 --features ocr。模型权重已置于 resources/ocr
# （det.mnn / rec.mnn / cls.mnn / dict.txt），打包时由 tauri.conf.json 一并打入 app；
# 如需重新下载运行 src-tauri/download_ocr_models.sh。模型缺失时 import 命令会返回
# 明确错误（前端提示用户），不会崩溃。
default = ["ocr"]
ocr = ["dep:rusto-rs"]

[profile.dev]
# macOS 链接器对超长命令行敏感：debug 默认 codegen-units=256 会把每个 crate 拆成
# 大量 .o，导致 cc 链接时 "Argument list too long"。设为 1 可正常链接（tauri dev 需要）。
codegen-units = 1

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
