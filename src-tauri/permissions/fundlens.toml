# FundLens 自定义命令权限定义（Tauri 2 应用开发者路径）
# 主应用命令不会自动生成 allow-* 权限，需在此显式声明。
# 使用 fl- 前缀以避免与潜在自动生成名冲突。

[[permission]]
identifier = "fl-get-overview"
description = "Enables the get_overview command."
commands.allow = ["get_overview"]

