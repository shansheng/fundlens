name: Windows Build

on:
  workflow_dispatch:
    inputs:
      create_release:
        description: '构建完成后自动创建 Draft GitHub Release（含 msi/exe 安装包）'
        type: boolean
        default: false
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'src-tauri/**'
      - 'package.json'
      - 'package-lock.json'

jobs:
  build-windows:
    runs-on: windows-latest
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Setup Rust (MSVC)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Cache Cargo registry & target
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            src-tauri/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('src-tauri/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Install frontend deps
        run: npm ci

      - name: Download OCR models (PP-OCRv4 / MNN)
        # 关键：必须在 tauri build 之前下载模型，否则安装包里 resources/ocr/ 为空，
        # 运行时 RustOConfig::ppv4 找不到 det.mnn/rec.mnn/dict.txt 直接报
        # "Failed to open file: \\?\D:\FundLens\ocr\det.mnn" 之类的误导性错误。
        # 模型来源：ModelScope RapidOCR（与 macOS/Linux dev 一致），脚本在源码仓库随附。
        shell: bash
        run: |
          bash src-tauri/download_ocr_models.sh
          echo "---- bundled OCR models ----"
          ls -la src-tauri/resources/ocr/

      - name: Build (msi + nsis)
        run: npx tauri build --bundles msi,nsis
        env:
          # MNN prebuilt 从 GitHub releases 下载，无需额外配置
          TAURI_SIGNING_PRIVATE_KEY: ''

      - name: Upload MSI artifact
        uses: actions/upload-artifact@v4
        with:
          name: fundlens-msi
          path: src-tauri/target/release/bundle/msi/*.msi
          if-no-files-found: warn

      - name: Upload NSIS artifact
        uses: actions/upload-artifact@v4
        with:
          name: fundlens-nsis
          path: src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: warn

      # 手动触发且勾选 create_release 时：创建 Draft Release 并挂载安装包
      - name: Create Draft GitHub Release
        if: github.event_name == 'workflow_dispatch' && inputs.create_release == 'true'
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          name: FundLens ${{ vars.APP_VERSION || '1.1.0' }}
          tag_name: v${{ vars.APP_VERSION || '1.1.0' }}
          files: |
            src-tauri/target/release/bundle/msi/*.msi
            src-tauri/target/release/bundle/nsis/*.exe
          generate_release_notes: true
